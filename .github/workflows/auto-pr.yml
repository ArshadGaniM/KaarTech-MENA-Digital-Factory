name: Auto PR

# Opens/updates a PR on push to any branch except main, using
# tasks/last-gate-report.md as the PR body when present (CLAUDE.md §9.3).
# Auto-merges only when that push carries a fresh, non-BLOCKED gate report —
# see CLAUDE.md §9.3 Step 5 for the full contract.

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare gate report body
        id: gate
        run: |
          if [ -f tasks/last-gate-report.md ]; then
            cp tasks/last-gate-report.md /tmp/pr_body.md
            if grep -qi "BLOCKED" tasks/last-gate-report.md; then
              echo "blocked=true" >> "$GITHUB_OUTPUT"
            else
              echo "blocked=false" >> "$GITHUB_OUTPUT"
            fi
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "No gate report yet — run the /gate protocol before merging." > /tmp/pr_body.md
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      # Uses `gh pr create`/`gh pr edit` directly instead of an action that
      # commits/force-pushes the branch (peter-evans/create-pull-request):
      # this branch already has its real commits pushed by the time this
      # workflow runs, so nothing here should ever rewrite its content —
      # doing so previously force-reset the branch to `base` on every push.
      - name: Open or update PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "${{ github.ref_name }}" --json number >/dev/null 2>&1; then
            gh pr edit "${{ github.ref_name }}" --body-file /tmp/pr_body.md
          else
            gh pr create --base main --head "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" --body-file /tmp/pr_body.md
          fi

      - name: Auto-merge on fresh non-BLOCKED gate report
        if: steps.gate.outputs.has_report == 'true' && steps.gate.outputs.blocked == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.ref_name }}" --squash --auto || true
