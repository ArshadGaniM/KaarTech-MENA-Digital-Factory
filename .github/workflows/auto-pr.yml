name: Auto PR

# Opens/updates a PR on push to any branch except main, using
# tasks/last-gate-report.md as the PR body when present (CLAUDE.md §9.3).
# Auto-merges only when THIS push's own commits (not merge commits, not
# commits already on main) modified tasks/last-gate-report.md and at least
# one other file (the "fresh" check, scripts/gate-fresh.sh) and it isn't
# BLOCKED. See CLAUDE.md §9.3 Step 5 for the full contract. A report merely
# present in the repo from an earlier, unrelated push does not count, and
# neither does one that arrived by merging main.

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare gate report body
        id: gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -f tasks/last-gate-report.md ]; then
            cp tasks/last-gate-report.md /tmp/pr_body.md
            # Match the actual verdict marker (❌ BLOCKED), not any prose
            # mention of the word "BLOCKED" — a report can legitimately say
            # "WARN, not BLOCKED" while explaining why it isn't blocked,
            # which a bare word-match would misfire on.
            if grep -q "❌ BLOCKED" tasks/last-gate-report.md; then
              echo "blocked=true" >> "$GITHUB_OUTPUT"
            else
              echo "blocked=false" >> "$GITHUB_OUTPUT"
            fi
            echo "has_report=true" >> "$GITHUB_OUTPUT"

            # Freshness check: the report only authorizes auto-merge if THIS
            # push's own commits changed it. Without this, a report from an
            # old, unrelated feature sits in the repo forever and silently
            # auto-merges every future push, gate or no gate (see
            # tasks/lessons.md). "Own" is decided by scripts/gate-fresh.sh,
            # which counts only non-merge commits that are not already on
            # main and requires the report plus at least one other file.
            # Merging main into a branch therefore never passes as a gate
            # run, even though it brings in other sessions' reports. A new
            # branch, or a commit we have no history for, is never fresh.
            # This is a heuristic, not a cryptographic guarantee: it stops
            # the accidents that were observed without claiming to stop a
            # determined actor, which suits this single-maintainer repo.
            fresh=$(bash scripts/gate-fresh.sh "$BEFORE_SHA" "$HEAD_SHA" || echo false)
            echo "fresh=${fresh}" >> "$GITHUB_OUTPUT"
          else
            echo "No gate report yet — run the /gate protocol before merging." > /tmp/pr_body.md
            echo "has_report=false" >> "$GITHUB_OUTPUT"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      # Uses `gh pr create`/`gh pr edit` directly instead of an action that
      # commits/force-pushes the branch (peter-evans/create-pull-request):
      # this branch already has its real commits pushed by the time this
      # workflow runs, so nothing here should ever rewrite its content —
      # doing so previously force-reset the branch to `base` on every push.
      - name: Open or update PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # `gh pr view` matches a PR by branch name regardless of state, so
          # once a branch's PR has merged/closed, a later push to the same
          # branch name would silently edit that dead PR instead of opening
          # a new one — checking `state == OPEN` is what makes this safe to
          # re-run after a branch has been restarted post-merge.
          state=$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null || echo "NONE")
          if [ "$state" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body-file /tmp/pr_body.md
          else
            gh pr create --base main --head "$BRANCH" \
              --title "$BRANCH" --body-file /tmp/pr_body.md
          fi

      - name: Auto-merge on fresh non-BLOCKED gate report
        if: steps.gate.outputs.has_report == 'true' && steps.gate.outputs.blocked == 'false' && steps.gate.outputs.fresh == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh pr merge "$BRANCH" --squash --auto || true
